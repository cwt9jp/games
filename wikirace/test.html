<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body>
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        async function run() {
            // Embedder model
            env.allowLocalModels = true;       // Enable local model loading
            env.allowRemoteModels = false;     // Disable downloading from Hugging Face Hub
            env.localModelPath = './models/';

            const extractor = await pipeline('feature-extraction', 'all-MiniLM-L6-v2', {
                dtype: 'q8',
                model_file_name: 'model'
            });
            
            const output = await extractor(["The Upper Maleri Formation is a sedimentary rock formation found in Telangana, India."], { pooling: 'mean', normalize: true });
            console.log(output);
        }
        run();
    </script>
</body>
</html>
